<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCP Java 25 Mastery — study console</title>
<meta name="description" content="Spaced-repetition drilling and timed mock exams for Oracle exam 1Z0-831, Java SE 25 Developer Professional.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="root">
  <div class="shell">
    <aside class="rail" id="rail" data-open="false" aria-label="Sections"></aside>
    <main class="main" id="main">
      <noscript>
        <h1>JavaScript is required</h1>
        <p>This study console runs entirely in the browser with no server. Enable JavaScript, or read the
        module notes directly in <code>../modules/</code>.</p>
      </noscript>
    </main>
  </div>

  <div style="position:fixed;top:12px;right:16px;z-index:60;display:flex;gap:6px">
    <button class="btn sm railtoggle" id="railbtn" aria-label="Toggle navigation">Menu</button>
    <button class="btn sm" id="themebtn" aria-label="Toggle light and dark theme">Theme</button>
  </div>
</div>

<script src="data/curriculum.js"></script>
<script src="data/questions-a.js"></script>
<script src="data/questions-b.js"></script>
<script src="data/questions-c.js"></script>
<script src="data/questions-d.js"></script>
<script src="data/questions-e.js"></script>
<script src="data/questions-f.js"></script>
<script src="data/papers.js"></script>
<script src="data/flashcards.js"></script>
<script src="data/notes.js"></script>
<script src="md.js"></script>
<script src="app.js"></script>
</body>
</html>
