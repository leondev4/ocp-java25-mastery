<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Segoe UI, sans-serif">
  <defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b8f"/></marker></defs>
  <rect width="860" height="400" rx="16" fill="#0b0f17"/>
  <text x="430" y="34" fill="#e6edf7" font-size="20" font-weight="700" text-anchor="middle">The String Pool — the #1 == trap</text>
  <text x="430" y="54" fill="#8b98ad" font-size="12" text-anchor="middle">by Yassin Ghariani — JavaBoy ☕</text>

  <!-- stack -->
  <rect x="40" y="80" width="270" height="290" rx="12" fill="#0d1b2a" stroke="#4da3ff" stroke-dasharray="6 4"/>
  <text x="175" y="104" fill="#4da3ff" font-size="13" font-weight="700" text-anchor="middle">🥞 STACK</text>
  <g font-family="monospace" font-size="12">
    <rect x="60" y="120" width="230" height="26" rx="6" fill="#132441" stroke="#24406b"/><text x="72" y="138" fill="#e6edf7">a = "java"</text><circle cx="278" cy="133" r="5" fill="#ff6b8f"/>
    <rect x="60" y="154" width="230" height="26" rx="6" fill="#132441" stroke="#24406b"/><text x="72" y="172" fill="#e6edf7">b = "java"</text><circle cx="278" cy="167" r="5" fill="#ff6b8f"/>
    <rect x="60" y="188" width="230" height="26" rx="6" fill="#132441" stroke="#24406b"/><text x="72" y="206" fill="#e6edf7">d = "ja" + "va"</text><circle cx="278" cy="201" r="5" fill="#ff6b8f"/>
    <rect x="60" y="222" width="230" height="26" rx="6" fill="#132441" stroke="#24406b"/><text x="72" y="240" fill="#e6edf7">e = c.intern()</text><circle cx="278" cy="235" r="5" fill="#ff6b8f"/>
    <rect x="60" y="270" width="230" height="26" rx="6" fill="#132441" stroke="#ffb84d"/><text x="72" y="288" fill="#e6edf7">c = new String("java")</text><circle cx="278" cy="283" r="5" fill="#ff6b8f"/>
  </g>
  <text x="175" y="330" fill="#8b98ad" font-size="11" text-anchor="middle">a == b == d == e → true</text>
  <text x="175" y="347" fill="#8b98ad" font-size="11" text-anchor="middle">a == c → false · a.equals(c) → true</text>

  <!-- heap -->
  <rect x="380" y="80" width="440" height="290" rx="12" fill="#0f2013" stroke="#37c871" stroke-dasharray="6 4"/>
  <text x="600" y="104" fill="#37c871" font-size="13" font-weight="700" text-anchor="middle">🏔️ HEAP</text>

  <rect x="410" y="124" width="380" height="130" rx="12" fill="#241f0c" stroke="#ffd54d" stroke-width="1.5"/>
  <text x="600" y="148" fill="#ffd54d" font-size="12" font-weight="700" text-anchor="middle">🏊 STRING POOL — each literal stored ONCE</text>
  <rect x="510" y="164" width="180" height="66" rx="10" fill="#141103" stroke="#ffd54d"/>
  <text x="600" y="190" fill="#ffd54d" font-size="11" text-anchor="middle" font-family="monospace">String (pooled)</text>
  <text x="600" y="212" fill="#e6edf7" font-size="16" text-anchor="middle" font-family="monospace">"java"</text>

  <rect x="510" y="280" width="180" height="66" rx="10" fill="#0f2418" stroke="#2f5e42"/>
  <text x="600" y="306" fill="#37c871" font-size="11" text-anchor="middle" font-family="monospace">new String(...)</text>
  <text x="600" y="328" fill="#e6edf7" font-size="16" text-anchor="middle" font-family="monospace">"java"</text>

  <!-- arrows -->
  <path d="M286,133 C400,133 430,192 506,192" fill="none" stroke="#ff6b8f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a3)"/>
  <path d="M286,167 C400,167 430,198 506,198" fill="none" stroke="#ff6b8f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a3)"/>
  <path d="M286,201 C400,201 430,205 506,205" fill="none" stroke="#ff6b8f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a3)"/>
  <path d="M286,235 C400,235 430,212 506,212" fill="none" stroke="#ff6b8f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a3)"/>
  <path d="M286,283 C400,283 430,313 506,313" fill="none" stroke="#ffb84d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a3)"/>
</svg>
