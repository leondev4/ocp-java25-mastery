<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="Segoe UI, sans-serif">
  <defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37c871"/></marker></defs>
  <rect width="860" height="360" rx="16" fill="#0b0f17"/>
  <text x="430" y="34" fill="#e6edf7" font-size="20" font-weight="700" text-anchor="middle">Generational Garbage Collection</text>
  <text x="430" y="54" fill="#8b98ad" font-size="12" text-anchor="middle">"most objects die young" — by Yassin Ghariani, JavaBoy ☕</text>

  <text x="60" y="106" fill="#e6edf7" font-size="13" font-family="monospace">new Object()</text>
  <path d="M170,101 L216,101" stroke="#37c871" stroke-width="2.5" marker-end="url(#a4)"/>

  <!-- young gen -->
  <rect x="220" y="70" width="360" height="180" rx="12" fill="#0d1b2a" stroke="#4da3ff" stroke-dasharray="6 4"/>
  <text x="400" y="94" fill="#4da3ff" font-size="13" font-weight="700" text-anchor="middle">👶 YOUNG GENERATION — Minor GC (fast, frequent)</text>
  <rect x="240" y="108" width="150" height="120" rx="10" fill="#0f1b2e" stroke="#2a4a76"/>
  <text x="315" y="132" fill="#4da3ff" font-size="12" font-weight="700" text-anchor="middle">Eden</text>
  <text x="315" y="152" fill="#8b98ad" font-size="10" text-anchor="middle">all births happen here</text>
  <g>
    <circle cx="280" cy="185" r="10" fill="#37c871"/><circle cx="315" cy="185" r="10" fill="#37c871"/>
    <circle cx="350" cy="185" r="10" fill="#3a4356"/><circle cx="298" cy="210" r="10" fill="#3a4356"/><circle cx="333" cy="210" r="10" fill="#37c871"/>
  </g>
  <rect x="410" y="108" width="72" height="120" rx="10" fill="#1f1a0e" stroke="#5e4a2f"/>
  <text x="446" y="132" fill="#ffb84d" font-size="11" font-weight="700" text-anchor="middle">S0</text>
  <circle cx="446" cy="170" r="10" fill="#37c871"/><text x="446" y="174" fill="#04101f" font-size="9" text-anchor="middle" font-weight="700">1</text>
  <rect x="492" y="108" width="72" height="120" rx="10" fill="#1f1a0e" stroke="#5e4a2f"/>
  <text x="528" y="132" fill="#ffb84d" font-size="11" font-weight="700" text-anchor="middle">S1</text>
  <circle cx="528" cy="170" r="10" fill="#37c871"/><text x="528" y="174" fill="#04101f" font-size="9" text-anchor="middle" font-weight="700">2</text>
  <path d="M394,168 L406,168" stroke="#ffb84d" stroke-width="2" marker-end="url(#a4)"/>
  <path d="M484,150 L490,150 M490,190 L484,190" stroke="#ffb84d" stroke-width="2"/>
  <text x="487" y="248" fill="#8b98ad" font-size="10" text-anchor="middle">survivors ping-pong S0↔S1, aging each GC</text>

  <!-- old gen -->
  <rect x="620" y="70" width="200" height="180" rx="12" fill="#1d1016" stroke="#ff6b8f" stroke-dasharray="6 4"/>
  <text x="720" y="94" fill="#ff6b8f" font-size="13" font-weight="700" text-anchor="middle">👴 OLD GENERATION</text>
  <text x="720" y="112" fill="#8b98ad" font-size="10" text-anchor="middle">Major GC — rarer, heavier</text>
  <circle cx="680" cy="160" r="12" fill="#b48cff"/><circle cx="720" cy="160" r="12" fill="#b48cff"/><circle cx="760" cy="160" r="12" fill="#b48cff"/>
  <text x="720" y="205" fill="#8b98ad" font-size="10" text-anchor="middle">caches, singletons,</text>
  <text x="720" y="220" fill="#8b98ad" font-size="10" text-anchor="middle">long-lived objects</text>
  <path d="M570,168 L614,168" stroke="#b48cff" stroke-width="2.5" marker-end="url(#a4)"/>
  <text x="592" y="156" fill="#b48cff" font-size="10" text-anchor="middle">age ≥ N</text>

  <!-- legend -->
  <circle cx="240" cy="300" r="8" fill="#37c871"/><text x="256" y="304" fill="#8b98ad" font-size="12">reachable (survives GC)</text>
  <circle cx="450" cy="300" r="8" fill="#3a4356"/><text x="466" y="304" fill="#8b98ad" font-size="12">unreachable → collected at next Minor GC</text>
  <text x="430" y="336" fill="#8b98ad" font-size="11" text-anchor="middle">Exam: System.gc() is only a REQUEST · eligibility = no path from any live reference · islands of isolation are collected</text>
</svg>
